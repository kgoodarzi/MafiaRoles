<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Redirecting...</title>
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mafia">
    <meta name="theme-color" content="#e94560">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/Splash.jpg">
    <script>
        // Preserve the URL path by redirecting to the root with a hash fragment
        // This allows your SPA router to handle the path correctly
        const path = window.location.pathname;
        // Use the repository name in the redirect to ensure it works with GitHub Pages
        window.location.href = '/MafiaRoles/' + (path.length > 1 ? '#' + path.substring(1) : '');
    </script>
</head>
<body>
    <p>Redirecting to homepage...</p>
</body>
</html>
